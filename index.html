<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoséLoop | روزية لوب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-deep:#E3367F;
    --pink-soft:#E7848E;
    --bg:#FDF6F8;
    --bg-card:#FFFFFF;
    --ink:#3A2530;
    --ink-soft:#8B6E76;
    --line:#F3D9E1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Cairo', sans-serif;
    background: radial-gradient(circle at 20% 0%, #FFF0F4 0%, var(--bg) 45%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 32px;
    position:relative;
    overflow-x:hidden;
  }

  /* decorative loop thread across background */
  .thread-bg{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:0.5;
  }
  .thread-bg svg{width:100%; height:100%;}

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .logo-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:8px;
    opacity:0;
    animation: riseIn 0.7s ease-out forwards;
  }
  .logo-wrap img{
    width:280px;
    height:auto;
  }

  .tagline{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.5px;
    margin-top:2px;
    margin-bottom:36px;
    opacity:0;
    animation: riseIn 0.7s ease-out 0.15s forwards;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 20px;
    background:var(--bg-card);
    border:1.5px solid var(--line);
    border-radius:18px;
    text-decoration:none;
    color:var(--ink);
    font-weight:600;
    font-size:16px;
    box-shadow:0 2px 10px rgba(227,54,127,0.05);
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    opacity:0;
    animation: riseIn 0.6s ease-out forwards;
    overflow:hidden;
  }
  .link-card:nth-of-type(1){animation-delay:0.28s;}
  .link-card:nth-of-type(2){animation-delay:0.38s;}
  .link-card:nth-of-type(3){animation-delay:0.48s;}
  .link-card:nth-of-type(4){animation-delay:0.58s;}

  .link-card:active{transform:scale(0.98);}
  .link-card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 24px rgba(227,54,127,0.16);
    border-color:var(--pink-soft);
  }

  .link-card .icon{
    flex-shrink:0;
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, var(--pink-deep), var(--pink-soft));
    color:#fff;
  }
  .link-card .icon svg{width:22px; height:22px;}

  .link-text{display:flex; flex-direction:column; gap:2px;}
  .link-text .label{font-size:16px; font-weight:700;}
  .link-text .sub{font-size:12.5px; color:var(--ink-soft); font-weight:500;}

  .link-card .arrow{
    margin-inline-start:auto;
    color:var(--pink-soft);
    flex-shrink:0;
  }

  /* store card gets a subtle featured style */
  .link-card.store{
    background:linear-gradient(135deg, #FFF5F8, #FFFFFF);
    border-color:var(--pink-deep);
  }

  footer{
    margin-top:44px;
    text-align:center;
    opacity:0;
    animation: riseIn 0.6s ease-out 0.7s forwards;
  }
  footer .heart-divider{
    width:60px;
    height:14px;
    margin:0 auto 14px;
    color:var(--pink-soft);
  }
  footer p{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.3px;
  }

  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .logo-wrap, .tagline, .link-card, footer{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
  }

  a:focus-visible, .link-card:focus-visible{
    outline:2.5px solid var(--pink-deep);
    outline-offset:3px;
  }
</style>
</head>
